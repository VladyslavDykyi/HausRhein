<div class="filter-bg">
	<div class="container">
		<div class="filter">
			<form class="filter__form" action="#">
				<div class="filter__form-left">
					<label for="search-filter">
						<input class="form-control" type="search" id="search-filter" name="search-filter" placeholder="Search by lot, artist...">
					</label>
					<p class="filter__text">
						<span>75 Lots</span><span> · </span><span>Showing 1–8</span>
					</p>
				</div>
				<div class="filter__form-right">
					<div class="filter__form-item">
						<label for="mySelect-author"></label>
						<select class="mySelect-increase" id="mySelect-author">
							<option value="value1">All Artists</option>
							<option value="value2">Alberto Giacometti</option>
						</select>
					</div>
					<div class="filter__form-item">
						<label for="mySelect-sort"></label>
						<select class="mySelect-increase" id="mySelect-sort">
							<option value="value1">Lot Number: Lowest</option>
							<option value="value2">Most Relevant</option>
							<option value="value3">Most Bids</option>
							<option value="value4">Price: Low to High</option>
							<option value="value5">Price: High to Low</option>
							<option value="value6">Estimate: Highest</option>
							<option value="value7">Promoted</option>
						</select>
					</div>
					<div class="filter__form-item">
						<label for="mySelect-view"></label>
						<select class="mySelect-increase" id="mySelect-view">
							<option value="value1">8 per page</option>
							<option value="value2">16 per page</option>
							<option value="value3">24 per page</option>
							<option value="value4">All lots</option>
						</select>
					</div>
					<div class="filter__form-item">
						<button class="btn" type="button">
							Reset all filter
						</button>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>
