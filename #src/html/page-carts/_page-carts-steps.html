<div class="viewport" data-viewport-mode="full">
	<div class="container">
		<div class="viewport__canvas">
			<!-- 4 стану стандартний без класів тільки  step і додаткові step--done , step--current, step--attention
			змінювання чи додавання них та блокування на стискання на посилання робиться через клас blokclick-->
			<nav class="stepper" data-stage="payment" aria-label="Order progress">
				<a href="#" class="step step--done" data-step="review">
					<span class="step__badge">1</span>
					<span class="step__label">Review Order</span>
				</a>
				
				<span class="stepper__line " aria-hidden="true"></span>
				
				<a href="#" class="step step--current" data-step="payment">
					<span class="step__badge">2</span>
					<span class="step__label">Payment</span>
				</a>
				
				<span class="stepper__line" aria-hidden="true"></span>
				
				<a href="#" class="step step--attention" data-step="confirmation">
					<span class="step__badge">3</span>
					<span class="step__label">Confirmation</span>
				</a>
			</nav>
		</div>
	</div>
</div>
